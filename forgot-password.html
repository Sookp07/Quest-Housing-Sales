<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Quest Housing Sales</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-page">

    <div class="login-box">
        <h1>Reset Password</h1>
        <p class="subtitle">Verify your identity to set a new password</p>

        <div class="login-error" id="errorMsg"></div>
        <div class="login-success" id="successMsg"></div>

        <!-- Step 1: Identity verification -->
        <form id="verifyForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <button type="submit" class="btn btn-primary">Verify Identity</button>
        </form>

        <!-- Step 2: New password (hidden initially) -->
        <form id="resetForm" style="display: none;">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter new password" minlength="6" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-success">Set New Password</button>
        </form>

        <div class="login-footer">
            Remembered it? <a href="login.html">Back to Sign In</a>
            <br><br>
            © 2026 Quest Housing Sales
        </div>
    </div>

</div>

<script>
    let verifiedUserId = null;

    /* ---- Step 1: Verify identity ---- */
    document.getElementById('verifyForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const date_of_birth = document.getElementById('dob').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        try {
            const response = await fetch('/api/verify-identity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, date_of_birth })
            });

            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = data.error || 'Verification failed';
                errorMsg.classList.add('show');
                return;
            }

            verifiedUserId = data.userId;
            successMsg.textContent = 'Identity verified! Set your new password below.';
            successMsg.classList.add('show');

            document.getElementById('verifyForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';

        } catch (err) {
            errorMsg.textContent = 'Server error. Please try again.';
            errorMsg.classList.add('show');
        }
    });

    /* ---- Step 2: Reset password ---- */
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        if (newPassword.length < 6) {
            errorMsg.textContent = 'Password must be at least 6 characters';
            errorMsg.classList.add('show');
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMsg.textContent = 'Passwords do not match';
            errorMsg.classList.add('show');
            return;
        }

        try {
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: verifiedUserId, newPassword })
            });

            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = data.error || 'Reset failed';
                errorMsg.classList.add('show');
                return;
            }

            successMsg.textContent = 'Password reset successful! Redirecting to login…';
            successMsg.classList.add('show');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);

        } catch (err) {
            errorMsg.textContent = 'Server error. Please try again.';
            errorMsg.classList.add('show');
        }
    });
</script>

</body>
</html>
